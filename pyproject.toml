[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pecker-public"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13.4,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend.pecker*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
